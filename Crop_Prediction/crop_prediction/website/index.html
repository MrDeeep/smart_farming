<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crop prediction model</title>
    <link rel="stylesheet" href="style.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 1;
            padding: 0;
        }

        body {
            background-image: url('https://raw.githubusercontent.com/MrDeeep/Crop_Prediction/main/crop_prediction/website/smart_image.png');
            background-size: cover;
            font-family: sans-serif;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 20px;
        }

        .login {
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 30px;
            width: 90%;
            max-width: 500px;
            margin: auto;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        form {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }

        input,
        button {
            width: 100%;
            padding: 15px;
            margin-bottom: 20px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
        }

        button {
            background-color: rgb(200, 113, 7);
            color: white;
            font-weight: bold;
            border: none;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        button:hover {
            background-color: rgb(220, 133, 27);
        }

        #predict {
            margin-top: 20px;
            color: rgb(39, 37, 37);
            font-weight: bold;
            text-align: center;
        }
    </style>
</head>

<body>
    <h1>Crop prediction model</h1>
    <div class="login">
        <form action="{{ url_for('predict') }}" method="post">
            <input type="text" name="N" placeholder="Nitrogen content in soil" required="required">
            <input type="text" name="P" placeholder="Phosphorus content in soil" required="required">
            <input type="text" name="K" placeholder="Potassium content in soil" required="required">
            <input type="text" name="temperature" placeholder="Temperature in Celsius" required="required">
            <input type="text" name="humidity" placeholder="humidity in the air" required="required">
            <input type="text" name="ph" placeholder="ph level of the soil" required="required">
            <input type="text" name="Rainfall" placeholder="rainfall in cm " required="required">
            <button type="submit" class="btn btn-primary btn-block btn-large">Predict</button>
        </form>
        {% if prediction_text %}
        <h1 id="predict">{{ prediction_text }}</h1>
        {% endif %}
    </div>
</body>

</html>
