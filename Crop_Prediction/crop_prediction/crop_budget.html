<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Crop Budget & Cost Management</title>

<style>
body {
  font-family: Arial, sans-serif;
  margin: 0;
  padding: 20px;
  background:
    linear-gradient(rgba(0,0,0,0.55), rgba(0,0,0,0.55)),
    url("https://images.unsplash.com/photo-1501004318641-b39e6451bec6");
  background-size: cover;
  background-attachment: fixed;
}

.container {
  max-width: 1100px;
  background: #ffffffee;
  margin: auto;
  padding: 25px;
  border-radius: 10px;
}

h1 {
  text-align: center;
  color: #1b5e20;
}

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 15px;
}

label {
  font-weight: bold;
}

input, select {
  width: 100%;
  padding: 8px;
  margin-top: 5px;
}

.result {
  margin-top: 25px;
  background: #e8f5e9;
  padding: 15px;
  border-radius: 8px;
}

.total {
  font-size: 20px;
  font-weight: bold;
  color: #2e7d32;
}
</style>
</head>

<body>
<div class="container">

<h1>🌾 Crop Budget & Cost Management System</h1>

<div class="grid">

  <div>
    <label>State</label>
    <select id="state"></select>
  </div>

  <div>
    <label>District</label>
    <select id="district"></select>
  </div>

  <div>
    <label>Crop</label>
    <select id="crop">
      <option value="rice">Rice</option>
      <option value="wheat">Wheat</option>
      <option value="maize">Maize</option>
    </select>
  </div>

  <div>
    <label>Land Area (acres)</label>
    <input type="number" id="area" value="1">
  </div>

  <div>
    <label>Farming Type</label>
    <select id="farmingType">
      <option value="traditional">Traditional</option>
      <option value="modern">Modern</option>
    </select>
  </div>

  <div>
    <label>Sowing Method</label>
    <select id="sowing">
      <option value="manual">Manual</option>
      <option value="machine">Machine</option>
    </select>
  </div>

  <div>
    <label>Irrigation Type</label>
    <select id="irrigation">
      <option value="electric">Electric Motor</option>
      <option value="diesel">Diesel Pump</option>
    </select>
  </div>

  <div>
    <label>Labour Rate (₹/day)</label>
    <input type="number" id="labourRate">
  </div>

  <div>
    <label>Harvest Type</label>
    <select id="harvest">
      <option value="labour">Labour</option>
      <option value="machine">Machine</option>
    </select>
  </div>

</div>

<div class="result">
  <h3>💰 Cost Breakdown (₹)</h3>
  <p>Seed Cost: ₹<span id="seed"></span></p>
  <p>Land Preparation Time: <span id="prep"></span> days</p>
  <p>Sowing Cost: ₹<span id="sowingCost"></span></p>
  <p>Irrigation Cost: ₹<span id="irrigationCost"></span></p>
  <p>Fertilizer Cost: ₹<span id="fert"></span></p>
  <p>Pesticide Cost: ₹<span id="pest"></span></p>
  <p>Labour Cost: ₹<span id="labour"></span></p>
  <p>Harvest Cost: ₹<span id="harvestCost"></span></p>
  <p>Miscellaneous Cost: ₹<span id="misc"></span></p>
  <hr>
  <p class="total">Total Cost: ₹<span id="total"></span></p>
</div>

</div>

<script>
/* ---------- LOCATION DATA ---------- */
const locationData = {
  "West Bengal": {
    "Paschim Bardhaman": { labour: 550, electric: 6, diesel: 92 },
    "Kolkata": { labour: 600, electric: 6.5, diesel: 94 }
  },
  "Bihar": {
    "Patna": { labour: 500, electric: 6, diesel: 90 }
  },
  "Punjab": {
    "Ludhiana": { labour: 650, electric: 7, diesel: 95 }
  }
};

/* ---------- CROP DATA ---------- */
const cropData = {
  rice:  { seed:1200, fert:1800, pest:800 },
  wheat: { seed:1000, fert:1500, pest:600 },
  maize: { seed:900,  fert:1400, pest:500 }
};

/* ---------- DOM ---------- */
const state = document.getElementById("state");
const district = document.getElementById("district");
const labourRate = document.getElementById("labourRate");

for (let s in locationData) state.add(new Option(s, s));

state.onchange = () => {
  district.innerHTML = "";
  for (let d in locationData[state.value]) {
    district.add(new Option(d, d));
  }
  labourRate.value = locationData[state.value][district.value].labour;
  calculate();
};

district.onchange = () => {
  labourRate.value = locationData[state.value][district.value].labour;
  calculate();
};

document.querySelectorAll("input, select")
  .forEach(e => e.addEventListener("input", calculate));

state.selectedIndex = 0;
state.onchange();

/* ---------- CALCULATION ---------- */
function calculate() {
  const area = +document.getElementById("area").value;
  const crop = document.getElementById("crop").value;
  const farmingType = document.getElementById("farmingType").value;
  const sowing = document.getElementById("sowing").value;
  const irrigation = document.getElementById("irrigation").value;
  const harvest = document.getElementById("harvest").value;
  const labourRateVal = +labourRate.value;
  const rates = locationData[state.value][district.value];

  let seed = cropData[crop].seed * area;
  let fert = cropData[crop].fert * area;
  let pest = cropData[crop].pest * area;

  /* Farming type impact */
  let labourDays = farmingType === "traditional" ? 12 : 7;
  let fertFactor = farmingType === "modern" ? 1.2 : 1;

  fert *= fertFactor;

  const sowingCost = sowing === "manual" ? area * 800 : area * 1200;
  const irrigationCost = irrigation === "electric"
    ? area * 50 * rates.electric
    : area * 20 * rates.diesel;

  const labourCost = labourRateVal * labourDays * area;
  const harvestCost = harvest === "labour"
    ? labourRateVal * 4 * area
    : area * 2000;

  const misc = area * 500;
  const prep = area * 2;

  const total = seed + fert + pest + sowingCost +
                irrigationCost + labourCost + harvestCost + misc;

  document.getElementById("seed").innerText = seed;
  document.getElementById("fert").innerText = Math.round(fert);
  document.getElementById("pest").innerText = pest;
  document.getElementById("sowingCost").innerText = sowingCost;
  document.getElementById("irrigationCost").innerText = irrigationCost;
  document.getElementById("labour").innerText = labourCost;
  document.getElementById("harvestCost").innerText = harvestCost;
  document.getElementById("misc").innerText = misc;
  document.getElementById("prep").innerText = prep;
  document.getElementById("total").innerText = Math.round(total);
}
</script>

</body>
</html>
